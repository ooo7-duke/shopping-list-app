[build]
  command = "npm run build"
  publish = "dist"
  # Decides whether a build runs at all. See scripts/netlify-ignore.sh.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
